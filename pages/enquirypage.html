<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="theme-color" content="#3D2314">
    <meta name="robots" content="index, follow">
    <meta name="author" content="NalediMaseko">
    <meta name="description" content="Send an enquiry to Mhlaba Hair for salon services, product questions, sponsorships, or volunteer opportunities.">
    <meta name="keywords" content="hair service enquiry, salon enquiry, Mhlaba Hair contact, product enquiry, sponsorship enquiry">
    <title>Enquire About Our Services | Mhlaba Hair</title>
    <link rel="canonical" href="https://www.mhlaba-hair.co.za/pages/enquirypage.html">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Enquire About Our Services | Mhlaba Hair">
    <meta property="og:description" content="Send an enquiry to Mhlaba Hair for salon services, product questions, sponsorships, or volunteer opportunities.">
    <meta property="og:url" content="https://www.mhlaba-hair.co.za/pages/enquirypage.html">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Enquire About Our Services | Mhlaba Hair">
    <meta name="twitter:description" content="Send an enquiry to Mhlaba Hair for salon services, product questions, sponsorships, or volunteer opportunities.">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <link rel="stylesheet" href="../styles/style.css">
</head>
<body>
    <header class="main-header">
        <div class="header-brand">
            <img src="../images/logo.png" alt="Business logo" class="nav-logo">
            <h1>We De</h1>
        </div>

        <nav class="navbar" aria-label="Main navigation">
            <a href="../index.html">Home</a>
            <a href="../about.html">About</a>
            <a href="../services.html">Services</a>
            <a href="../products.html">Products</a>
            <a href="../contactpage.html">Contact</a>
            <a href="enquirypage.html" class="active">Enquiry</a>
            <a href="../cart.html">Cart</a>
        </nav>
    </header>

    <main class="content-container">
        <section class="form-card">
            <h2>Make an Inquiry</h2>

            <form id="enquiryForm" class="booking-form" novalidate>
                <fieldset>
                    <legend>Inquiry Details</legend>

                    <div class="form-group">
                        <label for="inquiryType">Inquiry Type <span aria-label="required">*</span></label>
                        <select id="inquiryType" name="inquiryType" required>
                            <option value="">Please select</option>
                            <option value="service">Service Enquiry</option>
                            <option value="product">Product Enquiry</option>
                            <option value="volunteer">Volunteer Interest</option>
                            <option value="sponsorship">Sponsorship / Partnership</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="fullName">Full Name <span aria-label="required">*</span></label>
                        <input type="text" id="fullName" name="fullName" placeholder="Your full name" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address <span aria-label="required">*</span></label>
                        <input type="email" id="email" name="email" placeholder="you@example.com" required>
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone Number <span aria-label="required">*</span></label>
                        <input type="tel" id="phone" name="phone" placeholder="e.g. 021 123 4567" required>
                    </div>

                    <div class="form-group">
                        <label for="budget">Estimated Budget (optional)</label>
                        <input type="number" id="budget" name="budget" min="0" step="50" placeholder="e.g. 250">
                    </div>

                    <div class="form-group">
                        <label for="message">Project / Enquiry Details <span aria-label="required">*</span></label>
                        <textarea id="message" name="message" rows="6" placeholder="Tell us what you need, when you need it, and any details you want to share." required></textarea>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Send Inquiry</button>
                        <button type="reset" class="btn btn-secondary">Reset</button>
                    </div>

                    <p id="enquiryMessage" class="form-feedback" aria-live="polite"></p>
                </fieldset>
            </form>
        </section>
    </main>

    <script>
        const enquiryForm = document.getElementById('enquiryForm');
        const enquiryMessage = document.getElementById('enquiryMessage');

        function setFeedback(message, isError = false) {
            enquiryMessage.textContent = message;
            enquiryMessage.style.color = isError ? '#9b2c2c' : '#1f5f3b';
            enquiryMessage.style.marginTop = '1rem';
            enquiryMessage.style.fontWeight = '600';
            enquiryMessage.style.lineHeight = '1.5';
        }

        function buildInquiryResponse(type, name, budget, message) {
            const estimatedBudget = Number(budget);

            if (type === 'service') {
                const estimate = estimatedBudget > 0 ? estimatedBudget : 250;
                const availability = estimatedBudget > 0 ? 'within 5–7 business days' : 'within 1 week';
                return `Thank you, ${name}. Your service enquiry has been received. Estimated starting cost: $${estimate}. Availability: ${availability}. We will follow up with a tailored quote and project timeline based on your details.`;
            }

            if (type === 'product') {
                const estimate = estimatedBudget > 0 ? estimatedBudget : 120;
                const stockText = estimatedBudget > 0 ? 'limited stock available' : 'availability is being checked';
                return `Hi ${name}, your product enquiry is noted. Estimated item range: $${estimate}. Current status: ${stockText}. We will confirm specifications and availability before finalising the order.`;
            }

            if (type === 'volunteer') {
                return `Thank you, ${name}. We appreciate your interest in volunteering. Your application has been received and we will contact you shortly to discuss available roles, shifts, and onboarding details.`;
            }

            if (type === 'sponsorship') {
                return `Thank you, ${name}. Your sponsorship enquiry has been received. We will review your request and share package options, sponsorship benefits, and next steps within 2 working days.`;
            }

            return `Thank you, ${name}. We have received your enquiry and will contact you shortly.`;
        }

        enquiryForm.addEventListener('submit', function (event) {
            event.preventDefault();

            const formData = new FormData(enquiryForm);
            const inquiryType = formData.get('inquiryType')?.toString().trim() || '';
            const name = formData.get('fullName')?.toString().trim() || '';
            const email = formData.get('email')?.toString().trim() || '';
            const phone = formData.get('phone')?.toString().trim() || '';
            const budget = formData.get('budget')?.toString().trim() || '';
            const message = formData.get('message')?.toString().trim() || '';

            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (!inquiryType) {
                setFeedback('Please select the type of enquiry you want to send.', true);
                return;
            }

            if (!name || name.length < 2) {
                setFeedback('Please enter your full name.', true);
                return;
            }

            if (!email || !emailPattern.test(email)) {
                setFeedback('Please enter a valid email address.', true);
                return;
            }

            if (!phone || phone.length < 7) {
                setFeedback('Please enter a valid phone number.', true);
                return;
            }

            if (!message || message.length < 10) {
                setFeedback('Please provide a few more details so we can help you properly.', true);
                return;
            }

            const response = buildInquiryResponse(inquiryType, name, budget, message);
            setFeedback(response, false);
            enquiryForm.reset();
        });
    </script>
</body>
</html>
