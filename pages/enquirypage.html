<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="theme-color" content="#3D2314">
    <meta name="robots" content="index, follow">
    <meta name="author" content="NalediMaseko">
    <meta name="description" content="Send an enquiry to Mhlaba Hair for salon services, product questions, sponsorships, or volunteer opportunities.">
    <meta name="keywords" content="hair service enquiry, salon enquiry, Mhlaba Hair contact, product enquiry, sponsorship enquiry">
    <title>Enquire About Our Services | Mhlaba Hair</title>
    <link rel="canonical" href="https://www.mhlaba-hair.co.za/pages/enquirypage.html">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Enquire About Our Services | Mhlaba Hair">
    <meta property="og:description" content="Send an enquiry to Mhlaba Hair for salon services, product questions, sponsorships, or volunteer opportunities.">
    <meta property="og:url" content="https://www.mhlaba-hair.co.za/pages/enquirypage.html">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Enquire About Our Services | Mhlaba Hair">
    <meta name="twitter:description" content="Send an enquiry to Mhlaba Hair for salon services, product questions, sponsorships, or volunteer opportunities.">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <link rel="stylesheet" href="../styles/style.css">
</head>
<body>
    <header class="main-header">
        <h1>Mhlaba Hair</h1>
        <nav class="navbar" aria-label="Main navigation">
            <a href="homepage.html">Home</a>
            <a href="aboutuspage.html">About Us</a>
            <a href="bookingspage.html">Bookings</a>
            <a href="contactpage.html">Contact Us</a>
            <a href="productpage.html">Shop</a>
            <a href="enquirypage.html" class="active">Enquiry</a>
            <a href="calculatepage.html">Cart</a>
        </nav>
    </header>

    <main class="content-container">
        <section class="form-card">
            <h2>Make an Inquiry</h2>

            <form id="enquiryForm" class="booking-form" action="https://example.com/enquiry" method="post" novalidate>
                <fieldset>
                    <legend>Inquiry Details</legend>

                    <div class="form-group">
                        <label for="inquiryType">Inquiry Type <span aria-label="required">*</span></label>
                        <select id="inquiryType" name="inquiryType" required>
                            <option value="">Please select</option>
                            <option value="service">Service Enquiry</option>
                            <option value="product">Product Enquiry</option>
                            <option value="volunteer">Volunteer Interest</option>
                            <option value="sponsorship">Sponsorship / Partnership</option>
                        </select>
                        <p class="field-error" id="inquiryTypeError" aria-live="polite"></p>
                    </div>

                    <div class="form-group">
                        <label for="fullName">Full Name <span aria-label="required">*</span></label>
                        <input type="text" id="fullName" name="fullName" placeholder="Your full name" minlength="2" required>
                        <p class="field-error" id="fullNameError" aria-live="polite"></p>
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address <span aria-label="required">*</span></label>
                        <input type="email" id="email" name="email" placeholder="you@example.com" required>
                        <p class="field-error" id="emailError" aria-live="polite"></p>
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone Number <span aria-label="required">*</span></label>
                        <input type="tel" id="phone" name="phone" pattern="[0-9+()\s-]{7,20}" placeholder="e.g. 021 123 4567" required>
                        <p class="field-error" id="phoneError" aria-live="polite"></p>
                    </div>

                    <div class="form-group">
                        <label for="budget">Estimated Budget (optional)</label>
                        <input type="number" id="budget" name="budget" min="0" step="50" placeholder="e.g. 250">
                        <p class="field-error" id="budgetError" aria-live="polite"></p>
                    </div>

                    <div class="form-group">
                        <label for="message">Project / Enquiry Details <span aria-label="required">*</span></label>
                        <textarea id="message" name="message" rows="6" placeholder="Tell us what you need, when you need it, and any details you want to share." minlength="10" required></textarea>
                        <p class="field-error" id="messageError" aria-live="polite"></p>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Send Inquiry</button>
                        <button type="reset" class="btn btn-secondary">Reset</button>
                    </div>

                    <p id="enquiryMessage" class="form-feedback" aria-live="polite"></p>
                </fieldset>
            </form>
        </section>
    </main>

    <script>
        const enquiryForm = document.getElementById('enquiryForm');
        const enquiryMessage = document.getElementById('enquiryMessage');

        const errorMap = {
            inquiryType: 'inquiryTypeError',
            fullName: 'fullNameError',
            email: 'emailError',
            phone: 'phoneError',
            budget: 'budgetError',
            message: 'messageError'
        };

        function setFieldError(fieldId, message) {
            const field = document.getElementById(fieldId);
            const error = document.getElementById(errorMap[fieldId]);

            if (field) {
                field.setAttribute('aria-invalid', message ? 'true' : 'false');
            }

            if (error) {
                error.textContent = message || '';
            }
        }

        function setFeedback(message, isError = false) {
            enquiryMessage.textContent = message;
            enquiryMessage.style.color = isError ? '#9b2c2c' : '#1f5f3b';
            enquiryMessage.style.marginTop = '1rem';
            enquiryMessage.style.fontWeight = '600';
            enquiryMessage.style.lineHeight = '1.5';
        }

        function validateEnquiryForm() {
            let isValid = true;
            const formData = new FormData(enquiryForm);
            const inquiryType = formData.get('inquiryType')?.toString().trim() || '';
            const name = formData.get('fullName')?.toString().trim() || '';
            const email = formData.get('email')?.toString().trim() || '';
            const phone = formData.get('phone')?.toString().trim() || '';
            const message = formData.get('message')?.toString().trim() || '';
            const budget = formData.get('budget')?.toString().trim() || '';

            Object.keys(errorMap).forEach((key) => setFieldError(key, ''));

            if (!inquiryType) {
                setFieldError('inquiryType', 'Please select the type of enquiry.');
                isValid = false;
            }

            if (!name || name.length < 2) {
                setFieldError('fullName', 'Please enter your full name.');
                isValid = false;
            }

            if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                setFieldError('email', 'Please enter a valid email address.');
                isValid = false;
            }

            if (!phone || !/^[0-9+()\s-]{7,20}$/.test(phone)) {
                setFieldError('phone', 'Please enter a valid phone number.');
                isValid = false;
            }

            if (budget && Number(budget) < 0) {
                setFieldError('budget', 'Budget cannot be negative.');
                isValid = false;
            }

            if (!message || message.length < 10) {
                setFieldError('message', 'Please provide at least 10 characters of detail.');
                isValid = false;
            }

            return isValid;
        }

        enquiryForm.addEventListener('submit', async function (event) {
            event.preventDefault();

            if (!validateEnquiryForm()) {
                setFeedback('Please correct the highlighted fields before submitting.', true);
                return;
            }

            const formData = new FormData(enquiryForm);
            const submitButton = enquiryForm.querySelector('button[type="submit"]');
            const originalText = submitButton.textContent;
            submitButton.disabled = true;
            submitButton.textContent = 'Sending...';
            setFeedback('Sending your enquiry...');

            try {
                const endpoint = enquiryForm.getAttribute('action');
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Accept': 'application/json' },
                    body: formData
                });

                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }

                const responseMessage = `Thank you, ${formData.get('fullName')}. Your enquiry has been received successfully and our team will contact you soon.`;
                setFeedback(responseMessage, false);
                enquiryForm.reset();
            } catch (error) {
                const fallbackMessage = `Thank you, ${formData.get('fullName')}. Your enquiry has been prepared and is ready to send. Please use the email option if the server is unavailable.`;
                setFeedback(fallbackMessage, false);
            } finally {
                submitButton.disabled = false;
                submitButton.textContent = originalText;
            }
        });
    </script>
</body>
</html>
