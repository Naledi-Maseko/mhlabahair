<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="theme-color" content="#3D2314">
    <meta name="robots" content="index, follow">
    <meta name="author" content="NalediMaseko">
    <meta name="description" content="Book your salon appointment with Mhlaba Hair for braids, wig installation, wash and blowout, and tailored hair care services in Johannesburg.">
    <meta name="keywords" content="book salon appointment, hair appointment Johannesburg, braids booking, wig install booking, Mhlaba Hair">
    <title>Book an Appointment | Mhlaba Hair Salon</title>
    <link rel="canonical" href="https://www.mhlaba-hair.co.za/pages/bookingspage.html">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Book an Appointment | Mhlaba Hair Salon">
    <meta property="og:description" content="Book your salon appointment with Mhlaba Hair for braids, wig installation, wash and blowout, and custom hair care services.">
    <meta property="og:url" content="https://www.mhlaba-hair.co.za/pages/bookingspage.html">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Book an Appointment | Mhlaba Hair Salon">
    <meta name="twitter:description" content="Book your salon appointment with Mhlaba Hair for braids, wig installation, wash and blowout, and custom hair care services.">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <link rel="stylesheet" href="../styles/style.css">
</head>
<body>

    <!-- Header & Navigation at Top -->
    <header class="main-header">
        <div class="header-brand">
            <img src="../assets/images/logo1.0.jpg" alt="Mhlaba Hair logo" class="nav-logo">
            <nav class="navbar" aria-label="Main navigation">
                <a href="homepage.html">Home</a>
                <a href="aboutuspage.html">About Us</a>
                <a href="bookingspage.html" class="active">Bookings</a>
                <a href="contactpage.html">Contact Us</a>
                <a href="productpage.html">Shop</a>
                <a href="enquirypage.html">Enquiry</a>
                <a href="calculatepage.html">Cart</a>
            </nav>
        </div>
    </header>

    <!-- Main Form Section -->
    <main class="content-container">
        <section class="form-card">
            <h2>Appointment Booking Form</h2>
            <form action="#" method="post" class="booking-form">
                <fieldset>
                    <legend>Personal & Service Details</legend>
                    
                    <div class="form-group">
                        <label for="fullname">Full Name</label>
                        <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" placeholder="example@domain.com" required>
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" name="phone" pattern="[0-9]{10}" placeholder="e.g., 0123456789" required>
                    </div>

                    <div class="form-group">
                        <label for="dob">Date of Birth</label>
                        <input type="date" id="dob" name="dob" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Account Password</label>
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            minlength="8" 
                            pattern="(?=.*\d)(?=.*[a-z]).{8,}" 
                            placeholder="At least 8 chars (1 letter & 1 number)" 
                            required>
                    </div>

                    <div class="form-group">
                        <label for="style">Hair Style / Service</label>
                        <select id="style" name="style" required>
                            <option value="" disabled selected>Select a service</option>
                            <option value="jumbo-braids">Jumbo Braids</option>
                            <option value="medium-braids">Medium Braids</option>
                            <option value="smedium-braids">Small-Medium Braids</option>
                            <option value="small-braids">Small Braids</option>
                            <option value="fulani-braids">Fulani Braids</option>
                            <option value="Trim">Cut & Style</option>
                            <option value="wig-install">Wig Installation</option>
                            <option value="flip-sewin">Flip over sew in</option>
                            <option value="onep-sewin">One part sew in</option>
                            <option value="twop-sewin">Two part sew in</option>
                            <option value="threep-sewin">Three part sew in</option>
                            <option value="wash-blow">Wash & Blow Dry</option>
                            <option value="mint-treatment">Peppermint Treatment</option>
                            <option value="steam-treatment">Steam Treatment</option>
                            <option value="unbraid">Undo Braids</option>
                        </select>
                    </div>
                    <div class="form-group upload-group">
        <label for="style-reference">
            Upload Style Reference <span class="optional-tag">(If your style is not listed)</span>
        </label>
        <input 
            type="file" 
            id="style-reference" 
            name="style_reference" 
            accept="image/png, image/jpeg, image/webp"
            class="file-input"
        >
        <small class="help-text">Accepted formats: JPG, PNG, WEBP (Max: 5MB)</small>
    </div>

                    <div class="form-group">
                        <label for="comments">Comments / Special Requests</label>
                        <textarea id="comments" name="comments" rows="4" placeholder="Any specific notes for your stylist..."></textarea>
                    </div>

                    <div class="form-group checkbox-group">
                        <input type="checkbox" id="newsletter" name="newsletter" checked>
                        <label for="newsletter">Subscribe to our newsletter & special offers</label>
                    </div>
                </fieldset>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Submit Booking</button>
                    <button type="reset" class="btn btn-secondary">Clear Form</button>
                </div>
            </form>
        </section>
    </main>
<footer class="site-footer">
    <p>&copy; Copyright 2026 Mhlaba Hair. All Rights Reserved.</p>
</footer>
</body>
</html>
