<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mhlaba Hair</title>
</head>
<body>
    <header>
        <H1>Booking Your Appoointment </H1>
    </header>
    <main>
        <form action="/js/feedback.js" method="post">
            <fieldset>
                <legend>Bookings</legend>
                <div>
                    <label for="fullname">Full Name</label>
                    <input type="text" id="fullname" name="fullname">
                </div>
                 <div>
            <label for="email"> Email</label>
            <input type="email" id="email" name="email" required>
          </div>
                  <div>
            <label for="phone"> Phone Number</label>
            <input type="tel" id="phone" name="phone" pattern="{0-9}{10}" placeholder="e.g.,0123456789">            
        </div>
        <div>
            <label for="dob">Date of Birth</label>
            <input type="date" id="dob" name="dob">
        </div>
        <div>
            <label for="password">Password</label>
            <input 
            type="password"
            id="password"
            name="password"
            min length="8"
            pattern="(?=,*/d)(?=.*[a-z]).{8,}"
            aria-describedby="password-help"
            required >
        </div>
        <div>
            <label for="style"> Hair Style</label>
            <input type="style" id="colour" name="style">
        </div>
        <div>
            <label for="comments">Comments</label>
            <textarea id="comments" name="comments" rows="5" cols="40"> </textarea>
        </div>
        <div> 
            <label for="newletter"> Subscribe</label>
            <input type="checkbox" id="newletter" name="newletter" checked>
        </div>
        </fieldset>
        <button type="submit">Submit Feedback</button>
        <button type="reset"> Clear Forum</button>
    </form>

            </fieldset>
        </form>
    </main>
</body>
</html>
