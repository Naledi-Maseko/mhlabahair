<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="theme-color" content="#3D2314">
    <meta name="robots" content="index, follow">
    <meta name="author" content="NalediMaseko">
    <meta name="description" content="Contact Mhlaba Hair for salon enquiries, bookings, product questions, and directions to our Johannesburg hair salon.">
    <meta name="keywords" content="contact Mhlaba Hair, hair salon Johannesburg, booking enquiry, salon location, hair care questions">
    <title>Contact Mhlaba Hair | Book, Enquire & Visit Our Salon</title>
    <link rel="canonical" href="https://www.mhlaba-hair.co.za/pages/contactpage.html">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Contact Mhlaba Hair | Book, Enquire & Visit Our Salon">
    <meta property="og:description" content="Contact Mhlaba Hair for salon enquiries, bookings, product questions, and directions to our Johannesburg hair salon.">
    <meta property="og:url" content="https://www.mhlaba-hair.co.za/pages/contactpage.html">
    <meta property="og:image" content="https://www.mhlaba-hair.co.za/assets/images/image%20of%20the%20salon.jpg">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Contact Mhlaba Hair | Book, Enquire & Visit Our Salon">
    <meta name="twitter:description" content="Contact Mhlaba Hair for salon enquiries, bookings, product questions, and directions to our Johannesburg hair salon.">
    <meta name="twitter:image" content="https://www.mhlaba-hair.co.za/assets/images/image%20of%20the%20salon.jpg">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <link rel="stylesheet" href="../styles/style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "LocalBusiness",
      "name": "Mhlaba Hair",
      "image": "https://www.mhlaba-hair.co.za/assets/images/image%20of%20the%20salon.jpg",
      "telephone": "+27123456789",
      "email": "hello@mhlaba-hair.co.za",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "42 Mhlaba Street",
        "addressLocality": "Johannesburg",
        "addressCountry": "ZA"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": -26.2041,
        "longitude": 28.0473
      },
      "url": "https://www.mhlaba-hair.co.za/pages/contactpage.html"
    }
    </script>
</head>
<body>
    <header class="main-header">
        <div class="header-brand">
            <img src="../assets/images/logo1.0.jpg" alt="Mhlaba Hair logo" class="nav-logo">
            <nav class="navbar" aria-label="Main navigation">
                <a href="homepage.html">Home</a>
                <a href="aboutuspage.html">About Us</a>
                <a href="bookingspage.html">Bookings</a>
                <a href="contactpage.html" class="active">Contact Us</a>
                <a href="productpage.html">Shop</a>
                <a href="enquirypage.html">Enquiry</a>
                <a href="calculatepage.html">Cart</a>
            </nav>
        </div>
    </header>

    <main class="content-container">
        <section class="contact-section">
            <div class="contact-card">
                <h2>Visit or Call Us</h2>
                <div class="contact-list">
                    <div class="contact-item">
                        <div class="icon-box">📍</div>
                        <div class="contact-details">
                            <span class="contact-label">Location</span>
                            <p class="contact-value text-address">42 Mhlaba Street, Johannesburg, South Africa</p>
                        </div>
                    </div>
                    <div class="contact-item">
                        <div class="icon-box">☎️</div>
                        <div class="contact-details">
                            <span class="contact-label">Phone</span>
                            <a class="contact-value" href="tel:+27123456789">+27 12 345 6789</a>
                        </div>
                    </div>
                    <div class="contact-item">
                        <div class="icon-box">✉️</div>
                        <div class="contact-details">
                            <span class="contact-label">Email</span>
                            <a class="contact-value" href="mailto:hello@mhlaba-hair.co.za">hello@mhlaba-hair.co.za</a>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section class="map-section">
            <div id="map" class="map-container" aria-label="Map showing Mhlaba Hair location"></div>
        </section>

        <section class="form-card">
            <h2>Contact Us</h2>

            <form id="contactForm" class="booking-form" action="https://example.com/contact" method="post" novalidate>
                <fieldset>
                    <legend>Send a Message</legend>

                    <div class="form-group">
                        <label for="contactName">Your Name <span aria-label="required">*</span></label>
                        <input type="text" id="contactName" name="contactName" placeholder="Your full name" minlength="2" required>
                        <p class="field-error" id="contactNameError" aria-live="polite"></p>
                    </div>

                    <div class="form-group">
                        <label for="contactEmail">Email Address <span aria-label="required">*</span></label>
                        <input type="email" id="contactEmail" name="contactEmail" placeholder="you@example.com" required>
                        <p class="field-error" id="contactEmailError" aria-live="polite"></p>
                    </div>

                    <div class="form-group">
                        <label for="messageType">Message Type <span aria-label="required">*</span></label>
                        <select id="messageType" name="messageType" required>
                            <option value="">Select a category</option>
                            <option value="General Enquiry">General Enquiry</option>
                            <option value="Booking Request">Booking Request</option>
                            <option value="Product Question">Product Question</option>
                            <option value="Service Support">Service Support</option>
                            <option value="Sponsorship">Sponsorship</option>
                        </select>
                        <p class="field-error" id="messageTypeError" aria-live="polite"></p>
                    </div>

                    <div class="form-group">
                        <label for="contactMessage">Message <span aria-label="required">*</span></label>
                        <textarea id="contactMessage" name="contactMessage" rows="6" placeholder="Write your message here..." minlength="10" required></textarea>
                        <p class="field-error" id="contactMessageError" aria-live="polite"></p>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Send Message</button>
                        <button type="reset" class="btn btn-secondary">Clear</button>
                    </div>

                    <p id="contactStatus" class="form-feedback" aria-live="polite"></p>

                    <a id="mailtoLink" class="btn btn-secondary" style="display:none; margin-top:1rem;" target="_blank" rel="noopener">
                        Send Email
                    </a>
                </fieldset>
            </form>
        </section>
    </main>

    <script>
        const contactForm = document.getElementById('contactForm');
        const contactStatus = document.getElementById('contactStatus');
        const mailtoLink = document.getElementById('mailtoLink');
        const recipientEmail = 'hello@mhlaba-hair.co.za';

        const errorMap = {
            contactName: 'contactNameError',
            contactEmail: 'contactEmailError',
            messageType: 'messageTypeError',
            contactMessage: 'contactMessageError'
        };

        function setFieldError(fieldId, message) {
            const field = document.getElementById(fieldId);
            const error = document.getElementById(errorMap[fieldId]);

            if (field) {
                field.setAttribute('aria-invalid', message ? 'true' : 'false');
            }

            if (error) {
                error.textContent = message || '';
            }
        }

        function setContactStatus(message, isError = false) {
            contactStatus.textContent = message;
            contactStatus.style.color = isError ? '#9b2c2c' : '#1f5f3b';
            contactStatus.style.marginTop = '1rem';
            contactStatus.style.fontWeight = '600';
            contactStatus.style.lineHeight = '1.5';
        }

        function validateContactForm() {
            let isValid = true;
            const name = document.getElementById('contactName').value.trim();
            const email = document.getElementById('contactEmail').value.trim();
            const messageType = document.getElementById('messageType').value.trim();
            const message = document.getElementById('contactMessage').value.trim();

            setFieldError('contactName', '');
            setFieldError('contactEmail', '');
            setFieldError('messageType', '');
            setFieldError('contactMessage', '');

            if (!name || name.length < 2) {
                setFieldError('contactName', 'Please enter your full name.');
                isValid = false;
            }

            if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                setFieldError('contactEmail', 'Please enter a valid email address.');
                isValid = false;
            }

            if (!messageType) {
                setFieldError('messageType', 'Please choose the type of message.');
                isValid = false;
            }

            if (!message || message.length < 10) {
                setFieldError('contactMessage', 'Message must contain at least 10 characters.');
                isValid = false;
            }

            return isValid;
        }

        contactForm.addEventListener('submit', async function (event) {
            event.preventDefault();

            if (!validateContactForm()) {
                setContactStatus('Please correct the highlighted fields and try again.', true);
                return;
            }

            const formData = new FormData(contactForm);
            const submitButton = contactForm.querySelector('button[type="submit"]');
            const originalText = submitButton.textContent;
            submitButton.disabled = true;
            submitButton.textContent = 'Sending...';
            setContactStatus('Sending your message...');

            try {
                const endpoint = contactForm.getAttribute('action');
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Accept': 'application/json' },
                    body: formData
                });

                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }

                const subject = `[${formData.get('messageType')}] Message from ${formData.get('contactName')}`;
                const emailBody = [
                    `Name: ${formData.get('contactName')}`,
                    `Email: ${formData.get('contactEmail')}`,
                    `Message Type: ${formData.get('messageType')}`,
                    '',
                    'Message:',
                    formData.get('contactMessage')
                ].join('\n');

                const mailto = `mailto:${recipientEmail}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(emailBody)}`;
                mailtoLink.href = mailto;
                mailtoLink.style.display = 'inline-flex';
                mailtoLink.textContent = 'Open Email Client';

                setContactStatus('Your message was submitted successfully. You can also send it using the email option below.');
                contactForm.reset();
            } catch (error) {
                const subject = `[${formData.get('messageType')}] Message from ${formData.get('contactName')}`;
                const emailBody = [
                    `Name: ${formData.get('contactName')}`,
                    `Email: ${formData.get('contactEmail')}`,
                    `Message Type: ${formData.get('messageType')}`,
                    '',
                    'Message:',
                    formData.get('contactMessage')
                ].join('\n');

                const mailto = `mailto:${recipientEmail}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(emailBody)}`;
                mailtoLink.href = mailto;
                mailtoLink.style.display = 'inline-flex';
                mailtoLink.textContent = 'Send Email Instead';

                setContactStatus('Your message is ready to send. The form could not reach the server, so the email option was prepared for you.', true);
            } finally {
                submitButton.disabled = false;
                submitButton.textContent = originalText;
            }
        });
    </script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="../assets/js/site.js"></script>
</body>
</html>
