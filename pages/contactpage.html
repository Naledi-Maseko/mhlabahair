<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Mhlaba Hair</title>
    <link rel="stylesheet" href="../styles/style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>
    <header class="main-header">
        <h1>Contact Us</h1>
        <nav class="navbar" aria-label="Main navigation">
            <a href="homepage.html">Home</a>
            <a href="aboutuspage.html">About Us</a>
            <a href="bookingspage.html">Bookings</a>
            <a href="contactpage.html" class="active">Contact Us</a>
            <a href="productpage.html">Shop</a>
            <a href="calculatepage.html">Cart</a>
        </nav>
    </header>

    <main class="content-container">
        <section class="contact-section">
            <div class="contact-card">
                <h2>Visit or Call Us</h2>
                <div class="contact-list">
                    <div class="contact-item">
                        <div class="icon-box">📍</div>
                        <div class="contact-details">
                            <span class="contact-label">Location</span>
                            <p class="contact-value text-address">42 Mhlaba Street, Johannesburg, South Africa</p>
                        </div>
                    </div>
                    <div class="contact-item">
                        <div class="icon-box">☎️</div>
                        <div class="contact-details">
                            <span class="contact-label">Phone</span>
                            <a class="contact-value" href="tel:+27123456789">+27 12 345 6789</a>
                        </div>
                    </div>
                    <div class="contact-item">
                        <div class="icon-box">✉️</div>
                        <div class="contact-details">
                            <span class="contact-label">Email</span>
                            <a class="contact-value" href="mailto:hello@mhlaba-hair.co.za">hello@mhlaba-hair.co.za</a>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section class="map-section">
            <div id="map" class="map-container" aria-label="Map showing Mhlaba Hair location"></div>
        </section>

        <section class="form-card">
            <h2>Contact Us</h2>

            <form id="contactForm" class="booking-form" novalidate>
                <fieldset>
                    <legend>Send a Message</legend>

                    <div class="form-group">
                        <label for="contactName">Your Name <span aria-label="required">*</span></label>
                        <input type="text" id="contactName" name="contactName" placeholder="Your full name" required>
                    </div>

                    <div class="form-group">
                        <label for="contactEmail">Email Address <span aria-label="required">*</span></label>
                        <input type="email" id="contactEmail" name="contactEmail" placeholder="you@example.com" required>
                    </div>

                    <div class="form-group">
                        <label for="messageType">Message Type <span aria-label="required">*</span></label>
                        <select id="messageType" name="messageType" required>
                            <option value="">Select a category</option>
                            <option value="General Enquiry">General Enquiry</option>
                            <option value="Booking Request">Booking Request</option>
                            <option value="Product Question">Product Question</option>
                            <option value="Service Support">Service Support</option>
                            <option value="Sponsorship">Sponsorship</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="contactMessage">Message <span aria-label="required">*</span></label>
                        <textarea id="contactMessage" name="contactMessage" rows="6" placeholder="Write your message here..." required></textarea>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Send Message</button>
                        <button type="reset" class="btn btn-secondary">Clear</button>
                    </div>

                    <p id="contactStatus" class="form-feedback" aria-live="polite"></p>

                    <a id="mailtoLink" class="btn btn-secondary" style="display:none; margin-top:1rem;" target="_blank" rel="noopener">
                        Send Email
                    </a>
                </fieldset>
            </form>
        </section>
    </main>

    <script>
        const contactForm = document.getElementById('contactForm');
        const contactStatus = document.getElementById('contactStatus');
        const mailtoLink = document.getElementById('mailtoLink');

        const recipientEmail = 'hello@yourbusiness.com';

        function setContactStatus(message, isError = false) {
            contactStatus.textContent = message;
            contactStatus.style.color = isError ? '#9b2c2c' : '#1f5f3b';
            contactStatus.style.marginTop = '1rem';
            contactStatus.style.fontWeight = '600';
            contactStatus.style.lineHeight = '1.5';
        }

        contactForm.addEventListener('submit', function (event) {
            event.preventDefault();

            const name = document.getElementById('contactName').value.trim();
            const email = document.getElementById('contactEmail').value.trim();
            const messageType = document.getElementById('messageType').value.trim();
            const message = document.getElementById('contactMessage').value.trim();

            if (!name || name.length < 2) {
                setContactStatus('Please enter your full name.', true);
                return;
            }

            if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                setContactStatus('Please enter a valid email address.', true);
                return;
            }

            if (!messageType) {
                setContactStatus('Please choose the type of message you are sending.', true);
                return;
            }

            if (!message || message.length < 10) {
                setContactStatus('Please write a longer message so we can assist you properly.', true);
                return;
            }

            const subject = `[${messageType}] Message from ${name}`;
            const emailBody = [
                `Name: ${name}`,
                `Email: ${email}`,
                `Message Type: ${messageType}`,
                '',
                'Message:',
                message
            ].join('\n');

            const mailto = `mailto:${recipientEmail}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(emailBody)}`;

            mailtoLink.href = mailto;
            mailtoLink.style.display = 'inline-flex';
            mailtoLink.textContent = 'Open Email Client';

            setContactStatus('Your message is ready to send. Click the email button below to continue.');
        });
    </script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="../assets/js/site.js"></script>
</body>
</html>
