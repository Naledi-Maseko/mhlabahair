<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="NalediMaseko">
    <meta name="description" content="Explore and purchase hair care products at Mhlaba Hair.">
    <title>Shop - Mhlaba Hair</title>
    <!-- Relative path: steps out of pages/ into styles/ -->
    <link rel="stylesheet" href="../styles/style.css">
</head>
<body>

    <!-- Header & Navigation at Top -->
    <header class="main-header">
        <h1>Hair Products</h1>
        <nav class="navbar">
            <a href="homepage.html">Home</a>
            <a href="aboutuspage.html">About Us</a>
            <a href="bookingspage.html">Bookings</a>
            <a href="contactpage.html">Contact Us</a>
            <a href="productpage.html" class="active">Shop</a>
            <a href="calculatepage.html">Cart</a>
        </nav>
    </header>

    <!-- Main Content Container -->
    <main class="content-container">
        <section class="products-section">
            <h2>Our Haircare Products</h2>
            <p class="subtitle">Responsibly sourced and traditionally created for every hair type.</p>

            <div class="product-toolbar">
                <label class="search-field">
                    <span>Search</span>
                    <input id="productSearch" type="search" placeholder="Find a product...">
                </label>

                <label class="filter-field">
                    <span>Category</span>
                    <select id="productFilter">
                        <option value="all">All</option>
                        <option value="care">Care</option>
                        <option value="styling">Styling</option>
                        <option value="nourish">Nourish</option>
                    </select>
                </label>

                <label class="sort-field">
                    <span>Sort by</span>
                    <select id="productSort">
                        <option value="name-asc">Name A–Z</option>
                        <option value="name-desc">Name Z–A</option>
                        <option value="price-asc">Price: Low to High</option>
                        <option value="price-desc">Price: High to Low</option>
                    </select>
                </label>
            </div>

            <div class="product-grid" data-product-grid></div>
        </section>
    </main>

    <footer class="site-footer">
        <p>&copy; Copyright 2026 Mhlaba Hair. All Rights Reserved. </p>
    </footer>

    <script src="../assets/js/site.js"></script>
</body>
</html>
