<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | Mhlaba Hair</title>
    <meta name="description" content="The page you requested could not be found on the Mhlaba Hair website.">
    <style>
        :root {
            --brown: #3D2314;
            --gold: #D4AF6A;
            --cream: #f9f3ee;
            --white: #ffffff;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, var(--cream), #efe2d4);
            font-family: Arial, Helvetica, sans-serif;
            color: var(--brown);
            text-align: center;
        }

        .error-box {
            background: rgba(255,255,255,0.92);
            border: 2px solid rgba(212,175,106,0.7);
            border-radius: 18px;
            padding: 56px 32px;
            width: min(90vw, 560px);
            box-shadow: 0 18px 40px rgba(61,35,20,0.12);
        }

        h1 {
            margin: 0 0 12px;
            font-size: clamp(2.4rem, 6vw, 4rem);
            color: var(--brown);
        }

        p {
            margin: 0 0 24px;
            line-height: 1.6;
            color: rgba(61,35,20,0.8);
        }

        .btn {
            display: inline-block;
            background: var(--brown);
            color: var(--white);
            text-decoration: none;
            padding: 14px 24px;
            border-radius: 999px;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <main class="error-box">
        <h1>404</h1>
        <p>Oops! The page you are looking for does not exist or may have moved.</p>
        <a class="btn" href="index.html">Return to homepage</a>
    </main>
</body>
</html>
